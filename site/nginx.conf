server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: HTML responses must not be cached so updates load immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets with content-hashed filenames can be cached long-term
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Direct requests to index.html must never be cached
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
