apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cache-credentials
  namespace: {{ .Values.namespace | quote }}
  labels:
    app: cache-credentials
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-store
  target:
    name: cache-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.cacheSecretName | quote }}
        version: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-viewer
  namespace: {{ .Values.namespace | quote }}
  labels:
    app: cache-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-viewer
  template:
    metadata:
      labels:
        app: cache-viewer
    spec:
      containers:
        - name: viewer
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          volumeMounts:
            - name: secret-volume
              mountPath: "/etc/cache-credentials"
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: secret-volume
          secret:
            secretName: cache-credentials
