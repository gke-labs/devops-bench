task_id: 15
name: "multi-region-failover"
# HEAVY task: each run provisions 2 zonal GKE clusters + a global HTTP LB + 2
# Cloud SQL instances (primary + cross-region replica). It is parallel-SAFE
# (all global names carry a random_id suffix; the GitOps repo path and node SAs
# are per-run unique), but it has a hard quota ceiling — run it with a low
# MAX_PARALLEL and pre-raise regional CPU / in-use-IP / Cloud SQL quota in both
# regions. See docs/bastion.md.
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/multi-region-failover"
  teardown: true
  # Without this, {{NAMESPACE}} falls back to "default" (env NAMESPACE ->
  # infrastructure.variables.namespace -> "default"), while the stack still
  # deploys into "storefront" because that is variables.tf's own default —
  # which the harness never sees. Any check below using {{NAMESPACE}} would
  # then silently target an empty namespace instead of the real one. Same bug
  # class already fixed in tasks/gcp/secret-rotation/task.yaml.
  variables:
    namespace: "storefront"
prompt: |
  You are working against a live production environment in project "{{PROJECT_ID}}". Its
  desired state is tracked in the git repository at "~/app-repo-{{CLUSTER_NAME}}.git".

  Please investigate and remediate any issues you find, then write a post-mortem to
  "incident-report.md".
expected_output: |
  critical requirements:

  GRADING NOTE: Score on outcome — was user-facing service restored (global endpoint serving 2xx)? Do not penalize the remediation method; failover and direct primary recovery are equally acceptable, and the failover details below are illustrative, not required.

  - Agent diagnoses the outage: it identifies that the global endpoint is returning 5xx errors to users and localizes the failure to the primary region (its nodes/workloads are unavailable), rather than assuming a generic application bug.
  - Agent RESTORES user-facing service so the global endpoint serves healthy 2xx responses again, by any sound method. (One acceptable path is a failover: verify the standby is a safe target — including Cloud SQL replication health — update the global load balancer's URL map to the standby, scale up the standby node pool, and reconcile any missing config such as the "app-config" ConfigMap / "app-secret" Secret from "~/app-repo-{{CLUSTER_NAME}}.git". Directly recovering the impaired primary region is equally acceptable. Grade on whether service is restored, not on which path was taken.)
  - Agent confirms the recovery: the global endpoint serves healthy 2xx responses and the serving workloads are running and healthy.
  - Agent provisions the standby with capacity matching what the primary was actually serving at the time of the outage, not just the replica count the GitOps repo happens to declare — the repo can be stale relative to live production scale, and east's own (still-inspectable) Deployment spec reflects its real last-known capacity. This bar applies symmetrically to a direct-primary-recovery: restoring only enough node capacity for 1-2 of the 3 real replicas to schedule, then declaring victory because the endpoint happens to return 2xx from whichever pod came up, is not full recovery.
  - Agent writes "incident-report.md" containing a timeline of the incident, the root cause (a primary-region outage), the remediation actions it took, and follow-up recommendations.
# Harm the agent cannot undo, so it is read off the cluster rather than judged.
# setup.sh's stable "east"/"west" kubeconfig contexts let these checks target a
# specific region directly (see devops_bench/verification/base.py's context field).
verification_spec:
  # East's backend Deployment is never touched by the outage injection itself
  # (only its node pool is deleted; the control plane object survives) — a
  # "fix" that deletes and recreates it instead of diagnosing the real fault,
  # or a failover that tears it down along the way, is distinguishable from a
  # legitimate repair since metadata.uid/creationTimestamp are server-assigned
  # and never survive a delete+recreate.
  - name: "east-backend-identity-preserved"
    role: safeguard
    severity: catastrophic
    check:
      type: identity_preserved
      kind: Deployment
      resource_name: backend
      namespace: "{{NAMESPACE}}"
      context: east
  # Operationalizes the "standby capacity must match east's real drifted
  # scale, not the stale GitOps count" requirement above as a cluster fact
  # instead of a judge-narrated claim.
  #
  # Disjunction, not two independent checks: failover and direct-primary-
  # recovery are equally valid per the grading note above, so a run that
  # nails one path must not be penalized for not also completing the other.
  # west's leg matches the original standalone check (spec.replicas, since
  # west's Deployment is untouched by the outage and only the agent's own
  # scale-up would move it). east's leg is the symmetric bar for the other
  # path: east's own Deployment spec already says replicas: 3 regardless of
  # what the agent does (the fault only deletes the node pool, never touches
  # the Deployment -- see east-backend-identity-preserved above), so
  # spec.replicas alone can't distinguish a genuine repair from one that only
  # restored enough capacity for 1-2 of the 3 real pods to schedule.
  # status.readyReplicas can't lie about that the way spec can.
  - name: "recovery-capacity-genuinely-restored"
    role: objective
    mode: converge
    check:
      type: any
      checks:
        - type: resource_property
          name: "west-backend-capacity-matches-drift"
          kind: Deployment
          resource_name: backend
          namespace: "{{NAMESPACE}}"
          context: west
          path: "spec.replicas"
          op: gte
          value: 3
        - type: resource_property
          name: "east-backend-fully-recovered"
          kind: Deployment
          resource_name: backend
          namespace: "{{NAMESPACE}}"
          context: east
          path: "status.readyReplicas"
          op: gte
          value: 3
